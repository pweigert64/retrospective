<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine Retrospektive</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>
	<script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
	<script src="https://cdn.tailwindcss.com"></script>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
	<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
	<link rel="apple-touch-icon" href="favicon.png">
	<link rel="shortcut icon" href="favicon.png">
	<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="main-layout">
	<aside id="sidebar">
		<div class="flex items-center justify-between px-5 h-[60px] border-b md:flex">
			<div class="flex items-center justify-between w-full">
				<div class="flex items-center gap-2">
					<img src="favicon.png" alt="favIcon" class="w-9 h-10 inline-block">
					<button onclick="toggleInfoModal()" 
							class="w-5 h-5 flex items-center justify-center bg-blue-50 text-blue-600 hover:bg-blue-100 hover:text-blue-700 rounded-full transition-colors text-[11px] font-extrabold leading-none ml-1 shadow-sm" 
							title="Site-Info & Disclaimer">
						i
					</button>
				</div>
				
				<button onclick="toggleSidebar()" class="md:hidden text-xl leading-none">✕</button>
			</div>
		</div>
		<div id="sidebar-years"></div>
	</aside>
	<div id="sidebar-overlay" onclick="toggleSidebar()" class="hidden fixed inset-0 bg-black/30 z-[14000]"></div>
	
    <div id="content-area" class="flex-1 flex flex-col h-screen overflow-hidden">
        <header id="top-nav" class="flex items-center justify-between px-4 h-[60px] border-b shrink-0 gap-2">
		 	 <button onclick="toggleSidebar()" class="md:hidden mr-2 text-2xl" title="Menu">☰</button>
			 <button onclick="toggleTxtSearch()" class="flex min-w-0 flex-1 items-center gap-2 hover:bg-slate-100 p-1 rounded-lg transition-colors">
				<span class="text-lg">🔍</span>
				<div id="current-year-label" class="min-w-0 font-bold text-slate-500 tracking-normal italic"></div>
			 </button>

			 <div class="flex shrink-0 gap-1 bg-gray-100 p-1 rounded-xl">
				<button onclick="switchView('portal')" id="nav-portal" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg bg-white shadow-sm text-2xl">🗓️</button>
				<button onclick="switchView('map',true)" id="nav-map" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg opacity-50 text-2xl">🗺️</button>
				 <button onclick="switchView('peaks')" id="nav-peaks" class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg opacity-50 text-2xl" title="Gipfel">⛰️</button>
             </div>
        </header>


		<div id="txtSearchToolbar" class="hidden bg-white border-b px-4 py-3 flex flex-col gap-4 shadow-sm z-[1001]">
			<!-- LINE 1: Filters -->
			<div class="flex flex-col gap-1.5">
				<!-- "Filter:" label is now always visible and left-aligned -->
				<span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Aktivität Filter:</span>
				
				<div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1" id="header-filter-bar">
					<button class="filter-button filter-button-active" data-activity="ski">❄️</button>
					<button class="filter-button filter-button-active" data-activity="piste">🚠</button>
					<button class="filter-button filter-button-active" data-activity="hike">🥾</button>
					<button class="filter-button filter-button-active" data-activity="climb">⛰️</button>
					<button class="filter-button filter-button-active" data-activity="rope">🧗</button>
					<button class="filter-button filter-button-active" data-activity="bike">🚴</button>
					<button class="filter-button filter-button-active" data-activity="bike+hike">🚵</button>
					<button class="filter-button filter-button-active" data-activity="trip">🏛️</button>
				</div>
			</div>

			<!-- LINE 2: Search Input -->
			<div class="flex flex-col gap-1">
				<div class="flex items-center gap-2">
					<div class="relative flex-1">
						<input type="search" id="txtSearchInput" 
							placeholder="Gipfel, Region oder Tags..." 
							class="w-full p-2.5 bg-gray-100 rounded-lg outline-none focus:ring-2 focus:ring-slate-300 text-sm pl-9"
							oninput="handleTxtSearch(this.value)">
						<!-- Optional: Magnifying glass icon for better UX -->
						<span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
					</div>
					<button onclick="handleTxtSearch(document.getElementById('txtSearchInput').value, true)" 
							class="bg-slate-800 text-white px-5 py-2.5 rounded-lg text-xs font-bold hover:bg-slate-700 active:scale-95 transition-all shrink-0">
						GO
					</button>
				</div>
				<div class="flex items-center gap-3 px-1">
					<label class="flex items-center gap-1.5 text-[10px] text-slate-500" title="Reguläre Ausdrücke verwenden">
						<input type="checkbox" id="regexSearchToggle" onchange="handleTxtSearch(document.getElementById('txtSearchInput').value, true)">
						<span>Regex</span>
					</label>
					<span class="text-[10px] text-slate-400 italic">Achtung: Jahrfilter ist immer aktiv!</span>
				</div>
			</div>
		</div>

		<main class="flex-1 overflow-hidden relative">
			<section id="portal-view">
				<div id="portal-grid" 
					class="grid gap-4 w-full max-w-[2400px] mx-auto" 
					style="grid-template-columns: repeat(auto-fill, minmax(min(100%, 450px), 1fr));">
				</div>
			</section>

			<section id="peaks-view">
				<div class="peaks-toolbar">
				<div class="flex flex-wrap items-center justify-between gap-3 mb-2 max-w-[2400px] mx-auto">
					<div class="flex items-baseline gap-3"><h2 class="font-bold text-lg">Gipfel</h2><span id="peaks-count" class="text-xs text-slate-500"></span></div>
					<div class="ml-auto flex flex-wrap items-center justify-end gap-2">
						<div class="flex items-center gap-1 border border-slate-300 bg-white rounded px-2 py-1">
							<input id="peak-find-input" type="search" class="w-32 sm:w-44 text-sm outline-none" placeholder="Gipfel suchen…" oninput="searchPeaks(this.value)" onkeydown="handlePeakFindKey(event)" aria-label="In Gipfeln suchen">
							<span id="peak-find-count" class="min-w-12 text-center text-xs text-slate-500">0/0</span>
							<button type="button" class="w-8 h-8 hover:bg-slate-100 rounded" onclick="navigatePeakFind(-1)" title="Vorheriger Treffer" aria-label="Vorheriger Treffer">↑</button>
							<button type="button" class="w-8 h-8 hover:bg-slate-100 rounded" onclick="navigatePeakFind(1)" title="Nächster Treffer" aria-label="Nächster Treffer">↓</button>
						</div>
						<label for="peak-sort" class="text-sm text-slate-600">Sort</label>
						<select id="peak-sort" class="border border-slate-300 rounded px-2 py-1" onchange="renderPeaksGrid()">
							<option value="name">Gipfel</option>
							<option value="elevation">m</option>
							<option value="massif">Gebirge</option>
							<option value="first_visit" selected>Datum1</option>
						</select>
						<button id="peak-sort-direction" type="button" data-direction="desc" class="border border-slate-300 bg-white rounded px-2 py-1 text-sm" onclick="togglePeakSortDirection()" title="Toggle sort direction">Z→A</button>
					</div>
				</div>
				</div>
				<div id="peaks-grid" class="w-full max-w-[2400px] mx-auto"></div>
			</section>

			<section id="map-view">
				<div id="map-container">
					<div id="map"></div> <div id="map-settings-group" class="floating-container" style="top: 15px; right: 15px;">
						<button class="circle-toggle" onclick="togglePanel('map-panel')">🗺️</button>
						<div id="map-panel" class="pop-out-panel">
							<div class="bg-indigo-50 p-3 rounded-lg flex flex-col gap-2 text-[10px] font-bold">
								<div class="flex justify-between border-b border-indigo-200 pb-1 text-indigo-600">
									<span class="uppercase">Actual Zoom Level</span>
									<span id="zoom-level-display">11</span>
								</div>

								<!-- Map Provider Selection Grid -->
								<div class="grid grid-cols-1 gap-2">
									<button onclick="changeBaseLayer('opentopo')" class="filter-button base-layer-btn bg-white text-[9px] py-2" id="btn-opentopo">Open Topo Map</button>
									<button onclick="changeBaseLayer('maptiler')" class="filter-button base-layer-btn bg-white text-[9px] py-2" id="btn-maptiler">Map Tiler</button>
									<button onclick="changeBaseLayer('osm')" class="filter-button base-layer-btn bg-white text-[9px] py-2" id="btn-osm">Open Street Map</button>
									<button onclick="changeBaseLayer('sat_esri')" class="filter-button base-layer-btn bg-white text-[9px] py-2" id="btn-sat_esri">🛰️ SAT Esri</button>
									<button onclick="changeBaseLayer('sat_maptiler')" class="filter-button base-layer-btn bg-white text-[9px] py-2" id="btn-sat_maptiler">🛰️ SAT Maptiler(Hybrid)</button>
									<button onclick="changeBaseLayer('sat_google')" class="filter-button base-layer-btn bg-white text-[9px] py-2" id="btn-sat_google">🛰️ SAT Google(Hybrid)</button>
								</div>							
							</div>
						</div>
					</div>

					<div id="activity-settings-group" class="floating-container" style="bottom: 20px; right: 15px;">
						<div id="activity-panel" class="pop-out-panel">
							<!-- removed year selector -->
							<!-- removed activity filters -->
							<div class="pt-1 border-t">
								<div class="text-[10px] font-bold text-gray-400 uppercase mb-1">Koordinaten</div>
								<button id="coordinate-pick-mode" type="button" class="filter-button coordinate-pick-button w-full min-h-11 bg-white" onclick="toggleCoordinatePickMode()" aria-pressed="false">📍 Marker setzen</button>
								<p id="coordinate-copy-status" class="mt-1 text-[11px] leading-snug text-slate-500">Alt + Linksklick kopiert Lat und Lon.</p>
							</div>
							<div class="pt-1 border-t">
								<div class="text-[10px] font-bold text-gray-400 uppercase mb-1">Track Control:</div>
								<div class="flex flex-col gap-2">
									<button id="load-filtered-tracks-btn" class="filter-button w-full min-h-11 bg-emerald-700 text-white border-none" onclick="showFilteredTracks()">🗺️ Tracks laden [Filter]</button>
									<button class="filter-button w-full min-h-11 bg-amber-600 text-white border-none" onclick="showAllTracks()">🌍 Tracks laden [alle]</button>
									<button id="clear-tracks-btn" class="filter-button w-full min-h-11 bg-gray-500 text-white border-none" onclick="clearAllTracks()">🗑️ Tracks entfernen</button>
								</div>
								<p id="track-filter-status" class="mt-2 text-[11px] leading-snug text-slate-500"></p>
							</div>
							<div class="pt-2 border-t">
								<div class="text-[10px] font-bold text-gray-400 uppercase mb-1">Peak Control:</div>
								<label class="flex items-center gap-2 text-xs font-bold text-slate-700 cursor-pointer">
									<input id="show-peaks-map" type="checkbox" onchange="togglePeakMap(this.checked)">
									<span>Gipfel anzeigen</span>
								</label>
								<label class="flex items-center gap-2 mt-2 text-xs text-slate-600 cursor-pointer">
									<input id="filter-peaks-by-year" type="checkbox" onchange="togglePeakFilters(this.checked)">
									<span>Filter für Gipfel anwenden</span>
								</label>
							</div>
							<div class="mt-2 text-[9px] border-t pt-2">
								<button onclick="reloadData()" class="flex justify-between w-full uppercase">
									<span>🔄 Refresh Data</span>
									<span id="reload-status">IDLE</span>
								</button>
							</div>
						</div>
						<button class="circle-toggle" onclick="togglePanel('activity-panel')">⚙️</button>
					</div>
				</div>
			</section>
		</main>
    </div>
</div>

<div id="report-popup" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[2000] p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full max-h-[80vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150">
        
        <div class="flex items-center justify-between px-4 py-3 border-b bg-gray-50">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-wider flex items-center gap-1.5">
                📝 Tourenbericht
            </span>
            <button onclick="document.getElementById('report-popup').classList.add('hidden')" 
                    class="text-gray-400 hover:text-gray-600 text-lg p-1 leading-none font-bold">
                ✕
            </button>
        </div>
        
        <div id="report-popup-content" class="p-6 overflow-y-auto text-sm text-gray-700 leading-relaxed space-y-4">
            </div>
    </div>
</div>

<div id="info-modal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-[3000] p-4">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full overflow-hidden animate-in fade-in zoom-in-95 duration-150">
        
        <div class="flex items-center justify-between px-4 py-3 border-b bg-gray-50">
			<h3 class="text-sm font-bold text-gray-700 flex items-center gap-2">
                ℹ️ Über diese Website
				<span class="font-normal text-[10px] text-slate-400">v0.8</span>
            </h3>
            <button onclick="toggleInfoModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">✕</button>
        </div>
        
        <div id="info-modal-content" class="p-6 text-sm text-gray-600 leading-relaxed space-y-4">
            <p class="text-gray-400 italic">Loading Site-Info...</p>
        </div>
    </div>
</div>

<script src="app.js" defer></script>
</body>

</html>
