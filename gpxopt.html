<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GPX-Optimize</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; background: #f0f2f5; max-width: 850px; margin: 0 auto; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2563eb; margin-top: 0; }
        #drop-zone { border: 3px dashed #3b82f6; padding: 40px; text-align: center; background: #f8fafc; cursor: pointer; border-radius: 8px; margin-bottom: 20px; transition: 0.2s; }
        #drop-zone.hover { background: #dbeafe; border-color: #1d4ed8; }
        .control-panel { background: #f8fafc; padding: 20px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 20px; }
        .row { display: flex; align-items: center; gap: 15px; margin-bottom: 12px; }
        .label { font-weight: 600; width: 220px; }
        input[type="number"] { width: 70px; padding: 5px; border: 1px solid #cbd5e1; border-radius: 4px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.9em; border-top: 1px solid #e2e8f0; padding-top: 15px; margin-top: 10px; }
        .status-box { text-align: center; margin: 20px 0; font-weight: bold; color: #475569; border: 1px solid #cbd5e1; padding: 15px; border-radius: 6px; background: #fff; min-height: 1.5em; }
        .btn { display: block; width: 100%; padding: 15px; font-size: 1.1em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        #optimize-btn { background: #3b82f6; color: white; }
        #copy-btn { background: #64748b; color: white; }
        #download-btn { background: #10b981; color: white; }
        #save-as-btn { background: #8b5cf6; color: white; }
        #quick-save-btn { background: #f59e0b; color: white; display: none; }
        .size-info { font-size: 0.85em; color: #64748b; font-weight: normal; margin-top: 4px; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 GPX-Optimize</h2>
    
    <div id="drop-zone">GPX hierher ziehen oder klicken</div>
    <input type="file" id="file-input" style="display:none" accept=".gpx">

    <div class="control-panel">
        <div class="row">
            <span class="label">Min. Abstand [m]:</span>
            <input type="number" id="dist-input" value="10">
        </div>
        <div class="row">
            <span class="label">Nachkomma (Lat/Lon):</span>
            <input type="number" id="prec-input" value="5">
        </div>
        <div class="options">
            <label><input type="checkbox" id="check-time"> Zeit löschen</label>
            <label><input type="checkbox" id="check-ele"> Höhe löschen</label>
            <label><input type="checkbox" id="check-garbage" checked> Metadaten weg</label>
            <label><input type="checkbox" id="check-minify"> Komprimieren</label>
        </div>
    </div>

    <button id="optimize-btn" class="btn">Datei jetzt optimieren</button>
    <div id="status-box" class="status-box">Bereit.</div>

    <div class="action-area" style="margin-top: 20px; border-top: 2px solid #e2e8f0; padding-top: 20px;">
        <button id="copy-btn" class="btn">Filename kopieren (Warte auf Datei...)</button>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button id="download-btn" class="btn">Download</button>
            <button id="save-as-btn" class="btn">Ziel wählen</button>
        </div>
        <button id="quick-save-btn" class="btn">Speichern in: <span id="dir-name">...</span></button>
    </div>
</div>

<script>
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const copyBtn = document.getElementById('copy-btn');
    const statusBox = document.getElementById('status-box');
    const quickSaveBtn = document.getElementById('quick-save-btn');

    let rawXmlData = "";
    let finalXmlString = "";
    let originalSize = 0;
    let directoryHandle = null;
    let globalStoredFileName = ""; // Sicherheits-Variable

    // --- AUTOMATISCHE REPARATUR ---
    // Stellt sicher, dass der Name niemals verloren geht
    setInterval(() => {
        const stored = sessionStorage.getItem('lastGpxName') || globalStoredFileName;
        if (stored && !copyBtn.innerText.includes(stored)) {
            copyBtn.innerText = "Filename kopieren: " + stored;
        }
    }, 500);

    // --- DATEI LADEN ---
    dropZone.onclick = () => fileInput.click();
    fileInput.onchange = (e) => { if(e.target.files[0]) handleFile(e.target.files[0]); };

    dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('hover'); };
    dropZone.ondragleave = () => { dropZone.classList.remove('hover'); };
    dropZone.ondrop = (e) => {
        e.preventDefault();
        dropZone.classList.remove('hover');
        if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    };

    function handleFile(file) {
        originalSize = file.size;
        const reader = new FileReader();
        reader.onload = (e) => {
            rawXmlData = e.target.result;
            const newName = file.name.replace(/^track_20(\d{6})_\d{6}_/i, '$1_');
            
            // DREIFACHE SICHERUNG
            globalStoredFileName = newName;
            sessionStorage.setItem('lastGpxName', newName);
            copyBtn.innerText = "Filename kopieren: " + newName;
            
            statusBox.innerHTML = `Geladen: ${file.name} <br> <span class="size-info">Größe: ${(originalSize/1024).toFixed(1)} KB</span>`;
        };
        reader.readAsText(file);
    }

    // --- OPTIMIERUNG ---
    document.getElementById('optimize-btn').onclick = () => {
        if (!rawXmlData) return alert("Bitte zuerst eine Datei laden!");
        
        const parser = new DOMParser();
        const xml = parser.parseFromString(rawXmlData, "text/xml");
        const minDist = parseFloat(document.getElementById('dist-input').value);
        const prec = parseInt(document.getElementById('prec-input').value);
        const doTime = document.getElementById('check-time').checked;
        const doEle = document.getElementById('check-ele').checked;
        const doMinify = document.getElementById('check-minify').checked;

        let ptsIn = 0, ptsOut = 0;
        let newGpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="GPX-Pro" xmlns="http://www.topografix.com/GPX/1/1">`;

        const filterPoints = (pts, tag) => {
            let res = "";
            let lastLat = null, lastLon = null;
            const arr = Array.from(pts);
            ptsIn += arr.length;

            arr.forEach((p, i) => {
                const lat = parseFloat(p.getAttribute("lat"));
                const lon = parseFloat(p.getAttribute("lon"));
                let keep = (i === 0 || i === arr.length - 1);

                if (!keep && lastLat !== null) {
                    const dLat = (lat - lastLat) * 111320;
                    const dLon = (lon - lastLon) * 111320 * Math.cos(lat * Math.PI / 180);
                    if (Math.sqrt(dLat * dLat + dLon * dLon) >= minDist) keep = true;
                }

                if (keep) {
                    res += `\n    <${tag} lat="${lat.toFixed(prec)}" lon="${lon.toFixed(prec)}">`;
                    if (!doEle) {
                        const e = p.getElementsByTagName("ele")[0];
                        if (e) res += `<ele>${Math.round(parseFloat(e.textContent))}</ele>`;
                    }
                    if (!doTime) {
                        const t = p.getElementsByTagName("time")[0];
                        if (t) res += `<time>${t.textContent}</time>`;
                    }
                    res += `</${tag}>`;
                    lastLat = lat; lastLon = lon;
                    ptsOut++;
                }
            });
            return res;
        };

        const tracks = xml.getElementsByTagName("trk");
        for (let t = 0; t < tracks.length; t++) {
            const trkName = tracks[t].getElementsByTagName("name")[0]?.textContent;
            newGpx += `\n<trk>${trkName ? `\n  <name>${trkName}</name>` : ""}`;
            const segs = tracks[t].getElementsByTagName("trkseg");
            for (let s = 0; s < segs.length; s++) {
                newGpx += `\n  <trkseg>${filterPoints(segs[s].getElementsByTagName("trkpt"), "trkpt")}\n  </trkseg>`;
            }
            newGpx += `\n</trk>`;
        }

        newGpx += `\n</gpx>`;
        if (doMinify) newGpx = newGpx.replace(/>\s+</g, '><').trim();

        finalXmlString = newGpx;
        const newSize = new Blob([finalXmlString]).size;
        const red = ((1 - newSize / originalSize) * 100).toFixed(1);

        statusBox.innerHTML = `✅ Optimiert! <br> Punkte: ${ptsIn} → ${ptsOut} <br> <span class="size-info">Ersparnis: -${red}% (${(newSize/1024).toFixed(1)} KB)</span>`;
    };

    // --- COPY BUTTON ---
    copyBtn.onclick = () => {
        const name = sessionStorage.getItem('lastGpxName') || globalStoredFileName;
        if (!name) return;
        navigator.clipboard.writeText(name).then(() => {
            const old = copyBtn.innerText;
            copyBtn.innerText = "✅ KOPIERT!";
            setTimeout(() => { copyBtn.innerText = old; }, 1200);
        });
    };

    // --- SPEICHERN ---
    document.getElementById('download-btn').onclick = () => {
        if (!finalXmlString) return alert("Zuerst optimieren!");
        const name = sessionStorage.getItem('lastGpxName') || globalStoredFileName;
        const b = new Blob([finalXmlString], {type: "text/xml"});
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = name;
        a.click();
    };

    document.getElementById('save-as-btn').onclick = async () => {
        try {
            directoryHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            await performSave();
            quickSaveBtn.style.display = "block";
            document.getElementById('dir-name').innerText = directoryHandle.name;
        } catch (e) {}
    };

    quickSaveBtn.onclick = async () => { if(directoryHandle) await performSave(); };

    async function performSave() {
        const name = sessionStorage.getItem('lastGpxName') || globalStoredFileName;
        const handle = await directoryHandle.getFileHandle(name, { create: true });
        const writable = await handle.createWritable();
        await writable.write(finalXmlString);
        await writable.close();
        statusBox.innerHTML += `<br><span style="color: #10b981;">💾 Gespeichert!</span>`;
    }
</script>
</body>
</html>
